# ─────────────────────────────────────────────────────────────
#  LinkDialogues
#  BetonQuest 대화를 액션바 + 리소스팩 UI로 표시합니다.
#
#  BetonQuest 대화(conversation) 설정에서:
#    conversationIO: linkdialogues            -> default-style 사용
#    conversationIO: linkdialogues_<스타일명>   -> styles/<스타일명>.yml 사용
#  또는 BetonQuest config.yml 의  conversation.default_io: linkdialogues
# ─────────────────────────────────────────────────────────────

config-version: 4

Settings:
  default-style: default
  # 선택/진행 입력. F키(SwapHand)는 항상 사용되며, RightClick / LeftClick 을 추가할 수 있음
  interaction: [SwapHand]
  # 대화 종료 입력: Sneak / None
  exit: Sneak
  # 선택지 고르기: W/S 로 위/아래 이동, Space 로 결정 (선택지가 나와 있는 동안 이동이 완전히 잠김)
  select-keys: true
  # 핫바 입력 처리
  #   Number : 숫자키 1~6 으로 해당 번호 선택지로 이동 + 마우스 휠로 위/아래 이동, F키로 결정
  #            (선택 중 손에 든 슬롯이 8번으로 고정됨)
  #   Scroll : 마우스 휠로만 위/아래 이동
  #   None   : 사용 안 함
  hotbar: Number
  scroll-cooldown: 2      # 스크롤(핫바 이동) 입력 간격 (tick)
  click-cooldown: 4       # 클릭 입력 간격 (tick)
  refresh-interval: 10    # 액션바 재전송 간격 (tick)
  # 선택지가 없는 마지막 대사는 플레이어가 클릭할 때까지 화면에 유지
  wait-final-click: true
  # 마지막 대사 자동 종료 (tick, 0 = 클릭할 때까지 대기)
  final-auto-close: 0

# BetonQuest 대화 ID(패키지>대화) 또는 대화 이름별 스타일 지정 (conversationIO 이름 지정보다 우선순위 낮음)
# 예) "myPackage>innkeeper": kingdom
Conversation-Styles: {}

Pack:
  namespace: linkdialogues
  file-name: LinkDialogues
  description: 'LinkDialogues UI'
  min-format: 84
  max-format: 999
  # 서버 시작 시 리소스팩 자동 생성
  build-on-enable: true
  # 리소스팩 생성 시 함께 복사할 경로 (비우면 사용 안 함). 예: plugins/Nexo/pack/external_packs/LinkDialogues
  copy-to: ''
  # CraftEngine 자동 병합
  #  plugins/CraftEngine/resources/<folder>/ 에 pack.yml + resourcepack/ 을 생성 -> CraftEngine 이 자동으로 병합합니다.
  #  LinkDialogues 는 CraftEngine 보다 먼저 로드되므로 서버 시작 시에는 CraftEngine 빌드에 바로 포함됩니다.
  #  /ldl pack 실행 시 내용이 바뀌었으면 reload-command 를 콘솔로 실행합니다.
  craftengine:
    enabled: true
    folder: linkdialogues
    reload-command: 'ce reload pack'
  # 텍스트 폰트 (Pack/fonts 폴더의 TTF). 갈무리(Galmuri, SIL OFL 1.1) 기본 포함
  font:
    file: Galmuri7.ttf
    size: 8           # 픽셀 em 크기 (Galmuri7=8, Galmuri9=10)
    oversample: 4
    # 글자 윗부분(대문자/한글 꼭대기) 기준 보정. 비우면 폰트에서 자동 측정
    cap-height: -1

Messages:
  prefix: '<gray>[<gradient:#7fd3ff:#b78bff>LinkDialogues</gradient>]</gray> '
  reload: '<green>리로드 완료.</green>'
  pack-built: '<green>리소스팩 생성 완료: <white>{path}</white></green>'
  pack-failed: '<red>리소스팩 생성 실패: {error}</red>'
  unknown-style: '<red>존재하지 않는 스타일: {style}</red>'
  usage: '<gray>/ldl reload | pack | preview [스타일]</gray>'
