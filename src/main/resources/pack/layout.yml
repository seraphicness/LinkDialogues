# 리소스팩 레이아웃 (변경 후 /ldl pack 으로 리소스팩 재생성)
# ascent = 액션바 기준선에서 위로 몇 픽셀에 글자/이미지 윗부분이 오는지

Character-Name:
  ascent: 40

Dialogue-Lines:
  count: 5
  ascent: 25
  space: 9

Information-Line:
  ascent: -25

Answer-Lines:
  count: 3
  ascent: 75
  space: 9

# 이미지: images 폴더의 png. 텍스트 색으로 틴트되므로 밝은 회색/흰색 이미지 권장
# reduction-ratio: 이미지 축소 배율 (2 = 절반 크기)
# is-arrow: true 이면 선택지 줄마다 자동으로 위치가 맞춰짐 (ascent 무시, arrow-shift 로 미세조정)
Images:
  dialogue-background:
    file: dialogue.png
    reduction-ratio: 1
    ascent: 37
  answer-background:
    file: answer.png
    reduction-ratio: 1
    ascent: 81
  character-background:
    file: character.png
    reduction-ratio: 1
    ascent: 60
  hand:
    file: hand.png
    is-arrow: true
    arrow-shift: 0
    reduction-ratio: 1
  fog:
    file: fog.png
    reduction-ratio: 1
    ascent: 185
  name-start:
    file: name_start.png
    reduction-ratio: 1
    ascent: 43
  name-mid:
    file: name_mid.png
    reduction-ratio: 1
    ascent: 43
  name-end:
    file: name_end.png
    reduction-ratio: 1
    ascent: 43

# 커스텀 사운드: sounds 폴더의 ogg -> "<namespace>:<이름>" 으로 사용
# 예)
#   typing:
#     file: typing.ogg
Sounds: {}
